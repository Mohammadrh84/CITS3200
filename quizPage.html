<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mock Quiz</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="quiz-container">
        <form id="quiz-form">

            <!-- Question 1 -->
            <fieldset class="question">
                <legend>
                    Choose what action needs to be taken
                </legend>

                <div class="likert-scale">
                    <span class="scale-label agree-label">Agree</span>

                    <div class="options">
                        <label class="option agree-option">
                            <input
                                type="radio"
                                name="question1"
                                value="3"
                                aria-label="Strongly agree"
                            >
                            <span class="circle circle-large"></span>
                        </label>

                        <label class="option agree-option">
                            <input
                                type="radio"
                                name="question1"
                                value="2"
                                aria-label="Agree"
                            >
                            <span class="circle circle-medium"></span>
                        </label>

                        <label class="option agree-option">
                            <input
                                type="radio"
                                name="question1"
                                value="1"
                                aria-label="Slightly agree"
                            >
                            <span class="circle circle-small"></span>
                        </label>

                        <label class="option neutral-option">
                            <input
                                type="radio"
                                name="question1"
                                value="0"
                                aria-label="Neutral"
                            >
                            <span class="circle circle-neutral"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question1"
                                value="-1"
                                aria-label="Slightly disagree"
                            >
                            <span class="circle circle-small"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question1"
                                value="-2"
                                aria-label="Disagree"
                            >
                            <span class="circle circle-medium"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question1"
                                value="-3"
                                aria-label="Strongly disagree"
                            >
                            <span class="circle circle-large"></span>
                        </label>
                    </div>

                    <span class="scale-label disagree-label">Disagree</span>
                </div>
            </fieldset>

            <!-- Question 2 -->
            <fieldset class="question">

                    Decide how to go about something
                </legend>

                <div class="likert-scale">

                        </label>

                        <label class="option agree-option">
                            <input
                                type="radio"
                                name="question2"
                                value="1"
                                aria-label="Slightly agree"
                            >
                            <span class="circle circle-small"></span>
                        </label>

                        <label class="option neutral-option">
                            <input
                                type="radio"
                                name="question2"
                                value="0"
                                aria-label="Neutral"
                            >
                            <span class="circle circle-neutral"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question2"
                                value="-1"
                                aria-label="Slightly disagree"
                            >
                            <span class="circle circle-small"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"

                                value="-2"
                                aria-label="Disagree"
                            >
                            <span class="circle circle-medium"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question2"
                                value="-3"
                                aria-label="Strongly disagree"
                            >
                            <span class="circle circle-large"></span>
                        </label>
                    </div>

                    <span class="scale-label disagree-label">Disagree</span>
                </div>
            </fieldset>

            <!-- Question 3 -->
            <fieldset class="question">
                <legend>
                    Compare multiple courses of action
                </legend>

                <div class="likert-scale">
                    <span class="scale-label agree-label">Agree</span>

                    <div class="options">
                        <label class="option agree-option">
                            <input
                                type="radio"
                                name="question3"
                                value="3"
                                aria-label="Strongly agree"
                            >
                            <span class="circle circle-large"></span>
                        </label>

                        <label class="option agree-option">
                            <input
                                type="radio"

                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question3"
                                value="-1"
                                aria-label="Slightly disagree"
                            >
                            <span class="circle circle-small"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question3"
                                value="-2"
                                aria-label="Disagree"
                            >
                            <span class="circle circle-medium"></span>
                        </label>

                        <label class="option disagree-option">
                            <input
                                type="radio"
                                name="question3"
                                value="-3"
                                aria-label="Strongly disagree"
                            >
                            <span class="circle circle-large"></span>
                        </label>
                    </div>

                    <span class="scale-label disagree-label">Disagree</span>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit" class="submit-button">
                    Submit answers
                </button>
            </div>

        </form>
    </main>
</body>
</html>
